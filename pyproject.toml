[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "scholaros"
version = "1.0.0"
description = "A modular multi-agent AI research operating system."
readme = "README.md"
requires-python = ">=3.12"

authors = [
    { name = "Musa Khan" }
]

license = { text = "Apache-2.0" }

keywords = [
    "ai",
    "research",
    "agents",
    "langgraph",
    "computer-vision",
    "llm",
    "rag"
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "langchain>=1.3,<2.0",
    "langchain-core>=1.5,<2.0",
    "langchain-ollama>=1.0,<2.0",
]

[project.urls]
Homepage = "https://github.com/Musa-Khanj/ScholarOS"
Documentation = "https://github.com/Musa-Khanj/ScholarOS#readme"
Repository = "https://github.com/Musa-Khanj/ScholarOS.git"
Issues = "https://github.com/Musa-Khanj/ScholarOS/issues"
Changelog = "https://github.com/Musa-Khanj/ScholarOS/blob/main/CHANGELOG.md"

[project.scripts]
scholaros = "scholaros.cli.main:main"
scholaros-gui = "scholaros.gui.launcher:main"

[project.gui-scripts]
scholaros-desktop = "scholaros.gui.launcher:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "ruff>=0.12",
    "mypy>=1.16",
]
gui = []
build = [
    "build>=1.0",
    "wheel",
    "setuptools>=75",
]
all = [
    "scholaros[dev,build]",
]


[tool.setuptools.packages.find]
include = ["scholaros*"]


[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]


[tool.pytest.ini_options]
testpaths = [
    "tests"
]


[tool.mypy]
python_version = "3.14"
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
disallow_untyped_decorators = false
no_implicit_optional = false
warn_return_any = false
ignore_missing_imports = true