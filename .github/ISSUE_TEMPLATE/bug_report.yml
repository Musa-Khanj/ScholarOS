name: 🐛 Bug Report
description: Report an issue or unexpected behavior in ScholarOS
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please ensure you have searched existing issues before submitting.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what went wrong.
      placeholder: What happened when executing the action?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the issue.
      placeholder: |
        1. Run 'scholaros run ...' or open GUI
        2. Ingest document 'paper.pdf'
        3. Execute query '...'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Traceback
      description: Paste any error messages, terminal traceback, or log files (`logs/scholaros.log`).
      render: shell
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      description: Which platform are you running ScholarOS on?
      options:
        - Windows 11 / Windows 10
        - Ubuntu / Linux
        - macOS (Apple Silicon)
        - macOS (Intel)
    validations:
      required: true
  - type: dropdown
    id: python-version
    attributes:
      label: Python Version
      options:
        - Python 3.12
        - Python 3.13
        - Python 3.14
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: AI Provider
      options:
        - Ollama (Local)
        - OpenAI
        - Anthropic Claude
        - Google Gemini
        - OpenRouter
        - Mock Provider
    validations:
      required: false
