name: 💡 Feature Request
description: Propose a new capability, tool, or improvement for ScholarOS
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        We appreciate your ideas for making ScholarOS a more capable scientific research operating system!
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a specific scientific problem or limitation?
      placeholder: I always struggle when trying to...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see implemented.
      placeholder: Add support for... or implement a new pipeline stage that...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternative solutions or workarounds?
  - type: dropdown
    id: component
    attributes:
      label: Relevant Subsystem
      options:
        - Research Agent & Planner
        - Knowledge Library & Ingestion
        - RAG & Hybrid Retrieval
        - AI Models & Providers
        - Desktop GUI
        - Plugins & Tools
        - CLI & Automation
        - Core Microkernel & Storage
    validations:
      required: true
