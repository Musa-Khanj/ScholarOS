name: CI

"on":
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify:
    name: Verify (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        python-version: [ "3.12", "3.13", "3.14" ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"

      - name: Lint with Ruff
        run: |
          ruff check scholaros tests scripts

      - name: Type check with Mypy
        run: |
          mypy scholaros scripts

      - name: Run test suite with Pytest
        run: |
          pytest -p no:langsmith -q

      - name: Build distribution packages
        run: |
          python -m build --no-isolation --outdir dist

      - name: Verify package archives and entrypoints
        run: |
          python scripts/build_package.py --verify-only
