name: Nightly Regression & Benchmarks

"on":
  schedule:
    - cron: "0 2 * * *" # Every day at 02:00 UTC
  workflow_dispatch:

jobs:
  nightly:
    name: Full Workload Benchmarks & Quality Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"

      - name: Run Ruff Lint & Format Check
        run: |
          ruff check scholaros tests scripts

      - name: Run Mypy Static Type Analysis
        run: |
          mypy scholaros scripts

      - name: Run Performance & Workload Benchmarks
        run: |
          pytest tests/test_performance_and_workload.py -v

      - name: Run Full Regression Suite
        run: |
          pytest -p no:langsmith -q

      - name: Build and Verify Packages
        run: |
          python scripts/build_package.py --clean
